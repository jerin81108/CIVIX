<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Survey Records - B.K Builders</title>
    <script src="auth_guard.js"></script>
    <script src="file_manager.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="home_style.css">
    <style>
        .log_container { padding: 40px; }
        .horizontal_card {
            background: white;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 8px solid #2d5a27;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .data_item {
            flex: 1;
            min-width: 120px;
            padding: 5px 10px;
        }
        .label { font-size: 11px; color: #777; text-transform: uppercase; display: block; }
        .value { font-size: 14px; font-weight: bold; color: #333; }
        .action-row {
            display: flex;
            flex-direction: row;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 8px;
            align-items: center;
            white-space: normal;
        }
    </style>
</head>
<body>
    <div class="log_container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Survey Logs</h1>
            <button onclick="exportToExcel()" class="save-btn" style="width:auto; padding: 8px 15px; background: #2ecc71; border: none; border-radius: 5px; color: white; cursor: pointer;">📥 Export to Excel</button>
        </div>
        <a href="home.html" style="text-decoration: none; color: #2d5a27;">← Back to Home</a>
        <hr>
        <div id="log_list"></div>
    </div>

    <script>
        const userEmail = localStorage.getItem("regEmail");
        const userRole = localStorage.getItem("userRole");

        window.onload = async function() {
            const list = document.getElementById('log_list');
            
            try {
                const response = await authorizedFetch(`/api/surveys?email=${userEmail}`);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();

                if (data.length === 0) {
                    list.innerHTML = "<p>No surveys found on server. Checking local storage...</p>";
                    const localData = JSON.parse(localStorage.getItem('survey_reports')) || [];
                    if (localData.length > 0) {
                        displayData(localData);
                    } else {
                        list.innerHTML = "<p>No surveys found anywhere.</p>";
                    }
                    return;
                }

                displayData(data);
            } catch (error) {
                console.error('Error fetching surveys:', error);
                list.innerHTML = "<p>Could not connect to server. Showing local records.</p>";
                const localData = JSON.parse(localStorage.getItem('survey_reports')) || [];
                displayData(localData);
            }
        };

        function displayData(data) {
            const list = document.getElementById('log_list');
            list.innerHTML = ""; // Clear existing
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = "horizontal_card";
                
                const canEdit = (item.createdBy === userEmail || userRole === 'Admin');
                const fileItem = (item.files && item.files.length > 0) ? item.files[0] : (item.filePath ? {path: item.filePath, name: item.fileName} : null);
                
                let actionButtonsHtml = '';
                if (canEdit) {
                    actionButtonsHtml += `<button onclick="editRecord('${item._id}')" style="background: #f39c12; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;">Edit</button>`;
                }
                if (fileItem) {
                    actionButtonsHtml += `<button onclick="previewFile('${fileItem.path}', '${fileItem.name}')" style="background: #3498db; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;">👁️ View File</button>`;
                    actionButtonsHtml += `<button onclick="shareFile('${fileItem.path}', '${fileItem.name}')" style="background: #2ecc71; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;">📤 Send File</button>`;
                }

                let fileLink = 'N/A';
                if (item.files && item.files.length > 0) {
                    fileLink = item.files.map((f, idx) => `
                        <div style="margin-bottom: 6px; border-bottom: 1px dashed #eee; padding-bottom: 4px;">
                            <div style="font-size: 11px; font-weight: bold; color: #555;">File ${idx+1}</div>
                            <span style="font-size: 9px; color: #888; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px;" title="${f.name}">${f.name}</span>
                            <div style="display: flex; gap: 4px; margin-top: 3px;">
                                <button onclick="previewFile('${f.path}', '${f.name}')" class="file-action-btn view-btn" style="padding: 2px 5px; font-size: 10px;">👁️ View</button>
                                <button onclick="shareFile('${f.path}', '${f.name}')" class="file-action-btn share-btn" style="padding: 2px 5px; font-size: 10px;">📤 Send</button>
                            </div>
                        </div>
                    `).join('');
                } else if (item.filePath) {
                    fileLink = `
                        <div style="margin-bottom: 6px; border-bottom: 1px dashed #eee; padding-bottom: 4px;">
                            <span style="font-size: 9px; color: #888; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px;" title="${item.fileName}">${item.fileName}</span>
                            <div style="display: flex; gap: 4px; margin-top: 3px;">
                                <button onclick="previewFile('${item.filePath}', '${item.fileName}')" class="file-action-btn view-btn" style="padding: 2px 5px; font-size: 10px;">👁️ View</button>
                                <button onclick="shareFile('${item.filePath}', '${item.fileName}')" class="file-action-btn share-btn" style="padding: 2px 5px; font-size: 10px;">📤 Send</button>
                            </div>
                        </div>`;
                }

                div.innerHTML = `
                    <div class="data_item"><span class="label">Date/Time</span><span class="value">${item.date} ${item.time}</span></div>
                    <div class="data_item">
                        <span class="label">Customer</span>
                        <span class="value">${item.cli}</span><br>
                        <a href="tel:${item.cliNum}" style="font-size:11px; color:#2d5a27; text-decoration:none;">📞 ${item.cliNum || ''}</a>
                    </div>
                    <div class="data_item"><span class="label">File</span><span class="value">${fileLink}</span></div>
                    <div class="data_item"><span class="label">Location</span><span class="value">${item.loc}</span></div>
                    <div class="data_item"><span class="label">Size</span><span class="value">${item.size}</span></div>
                    <div class="data_item" style="min-width: 260px;">
                        <span class="label">Actions</span>
                        <div class="action-row">
                            ${actionButtonsHtml}
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function editRecord(id) {
            window.location.href = `survey_form.html?id=${id}`;
        }

        function exportToExcel() {
            const data = JSON.parse(localStorage.getItem('survey_reports')) || [];
            if (data.length === 0) return alert("Nothing to export");
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Logs");
            XLSX.writeFile(wb, "BK_Builders_Survey_Log.xlsx");
        }
    </script>
</body>
</html>
